- rule_id: EMP-MULT01
  source: List, Shaikh & Xu, Multiple hypothesis testing in experimental economics
  source_type: PEER_REVIEWED_METHOD
  edition_year: '2019'
  chapter_section: Abstract (p.773); section 1 Introduction (pp.774-775); section 2 Setup and Notation with Assumptions 2.1-2.3 and Remarks 2.1-2.2
    (pp.775-777); section 3 A Stepwise Multiple Testing Procedure, Algorithm 3.1, Theorem 3.1 and Remarks 3.1-3.8 (pp.777-781); section 4 Empirical
    Applications, Tables 1-5 (pp.781-788); section 5 Conclusion (pp.785-789)
  page_or_article_locator: Exp Econ 22(4):773-793; familywise arithmetic and prevalence at p.774; assignment and support assumptions at p.777;
    dominance over Bonferroni and Holm at p.779; adjusted p-value and logical restrictions at p.780; applied magnitudes in Tables 1-3 pp.782-784
    and the combined family at p.785; data requirement at p.789
  doi_or_stable_id: 10.1007/s10683-018-09597-5
  fulltext_verified: 'YES'
  transfer_scope: within-study multiplicity across outcomes, discrete subgroups and treatments, in an experiment where treatment status is assigned
    by simple random sampling
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'pp.773-774 name exactly three sources of multiplicity: multiple outcomes, subgroups defined by observed characteristics, and
    multiple treatments. p.774 supplies the arithmetic that makes the gate default-on rather than discretionary: with independent tests at the
    five per cent level the probability of at least one false rejection is 0.226 at five hypotheses, 0.401 at ten and 0.994 at a hundred, and
    the same page reports that 84 per cent of the surveyed experiments examine five or more outcomes and 61 per cent ten or more. Remark 3.2 at
    p.779 is the decisive operational statement: Bonferroni and Holm are the same stepwise algorithm run with a fixed critical value that assumes
    a least favourable dependence structure, and the resampling procedure will always reject at least as many null hypotheses as they do. p.780
    defines the adjusted p-value as the smallest level at which the hypothesis is rejected and recommends studentising. The applied section shows
    adjustment changing conclusions rather than decorating them: dollars given not including the match falls from significant at five per cent
    to significant only at ten (Table 1, p.782); two of four subgroups fall to one (Table 2, p.783); the 2:1 match moves from 0.0477 to 0.1297
    and stops being significant at any conventional level (p.783, Table 3 p.784); and across the combined family of 48 hypotheses the rejections
    at ten per cent fall from 21 to 9, with 7 of the 9 attached to a single outcome (p.785). p.785 states the reporting standard the skill adopts,
    that multiplicity-adjusted results be reported alongside the conventional unadjusted ones'
  claim_not_supported: anything about selection of the research question across the literature, and anything about repeated specification search
    on one dataset; those are separate layers. Inside its own layer the scope is narrower than it looks. Remark 2.1 at p.777 assumes treatment
    status is i.i.d., so the procedure does not accommodate covariate-adaptive or stratified assignment designed to balance baseline covariates,
    and a design of that kind must be resolved before this source is cited. Assumption 2.3 at p.777 requires treatment and the subgroup variable
    to be discrete with finite support, so continuous moderators fall outside it. Remark 2.2 at p.777 concedes that with a very large family,
    familywise control materially limits the ability to detect genuinely false nulls, and points to generalised error rates instead. Remark 3.7
    at p.780 confines the logical-restriction improvement to more than two treatments and warns that it becomes computationally prohibitive beyond
    a few; Table 4 at p.784 shows it moving p-values without producing any extra rejection. p.789 notes the procedure needs the underlying data,
    so where only published unadjusted p-values exist, Bonferroni or Holm is the applicable tool. None of this converts an exploratory rejection
    into a confirmatory one
