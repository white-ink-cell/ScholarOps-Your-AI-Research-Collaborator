  source: W3C, PROV-DM - The PROV Data Model
  source_type: TECHNICAL_STANDARD
  edition_year: '2013'
  chapter_section: W3C Recommendation 30 April 2013; section 1 Introduction; section 2.1 PROV Core Structures with 2.1.1 Entity and Activity,
