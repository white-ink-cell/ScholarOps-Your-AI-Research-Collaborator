tasks:
- task_class: PROJECT_RECOVERY
  trigger_examples: RE; resume this research project; continue prior staged research; recover project state
  required_modules: 00 + 08 + 07; then task modules only if a separate task is present
  routing_note: Recover structured canonical state first; validate against registered artifacts; consult archived conversation evidence only if
    needed; respect Seen Data boundaries; RE alone stops after recovery.
- task_class: WORKFLOW_AUDIT
  trigger_examples: AU; audit the current research workflow; trace the earliest material gap
  required_modules: 00 + 08 + 07 + modules actually used by the current workflow
  routing_note: Audit already-performed work and return the earliest material gap or inconsistency. AU alone does not advance the research state.
- task_class: RESEARCH_QUESTION_FORMATION
  trigger_examples: form a research question; screen candidate research problems; define actor/construct/estimand/so-what
  required_modules: 00 + 01 + 05 + 07 + 08
  routing_note: Apply question/contribution governance without forcing empirical or AI-specific modules.
- task_class: LITERATURE_SEARCH
  trigger_examples: literature search; focused census; collision screening; novelty/contribution adjudication; L4
  required_modules: 00 + 01 + 07 + 08
  routing_note: Run literature/collision workflow; use source-quality and collision-evidence gates; do not load AI profile for ordinary finance/accounting
    research.
- task_class: METHOD_OR_DESIGN
  trigger_examples: research design; identification; measurement design; pilot/screen/formal design; model/estimator choice
  required_modules: 00 + 01 + 02 + 07 + 08 (+06 only if specialized)
  routing_note: Classify the empirical execution class and run method precedent/identification requirements before outcome-bearing execution.
- task_class: DATA_PROCESSING
  trigger_examples: raw data; data QA; cleaning; merging; variable construction; missing data; outliers; panel build
  required_modules: 00 + 02 + 07 + 08 (+04 when new access is needed)
  routing_note: Use assistant-first execution where host capabilities permit; preserve raw identity and blind-data boundaries.
- task_class: OUTCOME_SCREEN
  trigger_examples: optional effect-open outcome decision screen; resource-allocation screen; screen failure diagnosis
  required_modules: 00 + 01 + 02 + 07 + 08
  routing_note: OUTCOME_DECISION_SCREEN is resource-allocation only. Freeze screen rules and reuse policy before effect open. Formal SESOI/equivalence/economic-null
    adjudication belongs to FORMAL_STUDY.
- task_class: FORMAL_STUDY
  trigger_examples: formal main estimation; run frozen primary specification; formal economic-threshold adjudication
  required_modules: 00 + 01 + 02 + 07 + 08 (+04/05/06 only if actually triggered)
  routing_note: Requires Freeze B formal main specification and formal identification. Run frozen estimation/result QA before mechanism, robustness,
    or writing claims.
- task_class: ACCESS_DATA
  trigger_examples: data access; WRDS; Bloomberg; LSEG; paid/private research databases; API/bulk entitlement
  required_modules: 00 + 04 + 07 + 08 (+02 if processing follows)
  routing_note: Platform existence is not entitlement or scalable research access. Search lawful construct-preserving alternatives before declaring
    access blocked.
- task_class: AI_FINANCE_RESEARCH
  trigger_examples: research on AI/LLMs/agents/automation in finance, accounting, insurance or related business domains
  required_modules: 00 + 01 + 03 + 04 + 05 + 07 + 08 (+02/06 if task requires)
  routing_note: Load AI × Finance only as an explicit specialization profile. It must not redefine ordinary finance/accounting research.
- task_class: SPECIAL_EXPERIMENT
  trigger_examples: human-subject experiment; expert labeling; task benchmark/evaluation; marginal workflow value; cost-quality design
  required_modules: 00 + 01 + 06 + 07 + 08 (+02 if empirical)
  routing_note: Load specialized gates only when the design actually uses them.
- task_class: WRITING_CLAIM_DISCIPLINE
  trigger_examples: write research results from frozen evidence; claim ceiling; evidence-to-claim mapping
  required_modules: 00 + 01 + 07 + 08 + relevant frozen project artifacts
  routing_note: Use frozen evidence and claim ceiling. This is research-writing governance, not general prose polishing.
- task_class: TASK_CLOSURE_VALIDATION
  trigger_examples: automatic before claiming a task complete/PASS or handing off a formal result
  required_modules: 00 + 07 + 08 + modules used by the current task
  routing_note: Use LIGHT closure for ordinary tasks and MILESTONE validation for formal freezes/results/releases. Do not confuse a defined contract
    with observed host execution.
gates:
- gate_id: GATE-CONSTRUCT-IDENTITY
  gate: Construct/claim identity
  activation_class: ALWAYS_ON
  trigger: all research tasks
  execution: name the construct and the measured object once per new design or claim, per CORE-Q02 and EMP-DATA02; silent thereafter unless they
    diverge
- gate_id: GATE-STATE-NOSKIP
  gate: Current state/no-skip
  activation_class: ALWAYS_ON
  trigger: all research tasks
  execution: one-line entry anchor per EMP-ENTRY01 before any estimation output; silent thereafter unless a state is skipped or unevidenced
- gate_id: GATE-SEEN-BLINDNESS
  gate: Seen Data/blindness
  activation_class: ALWAYS_ON
  trigger: empirical/confirmatory tasks
  execution: state SEEN_DATA_STATUS before any effect is opened and write the exposure into the register, per GOV-SEEN01 and EMP-BLIND03; silent
    thereafter
- gate_id: GATE-CLAIM-DRIFT
  gate: Claim drift
  activation_class: ALWAYS_ON
  trigger: all staged projects
  execution: on any return to an earlier stage or change of claim, record reason, evidence and supersedes, per GOV-DRIFT01 and GOV-STATE02; silent
    when the claim is unchanged
- gate_id: GATE-SOURCE-QUALITY
  gate: Source quality
  activation_class: ALWAYS_ON
  trigger: literature/evidence claims
  execution: name the source tier and authority for each evidence claim, per CORE-LIT06; silent when the claim rests on an already-registered
    source
- gate_id: GATE-ASSISTANT-FIRST
  gate: Assistant-first execution
  activation_class: ALWAYS_ON
  trigger: data/code tasks
  execution: when host capabilities and permissions permit, run the data/code step directly and report what was executed; escalate only the genuinely
    blocked acquisition/permission step
- gate_id: GATE-VERSION-RESOLUTION
  gate: Version resolution
  activation_class: ALWAYS_ON
  trigger: multiple ScholarOps copies or ambiguous release identity
  execution: resolve CANONICAL_VERSION_STATUS from explicit release identity and verified fixity when applicable; automatic and silent when a
    single trusted copy is loaded
- gate_id: GATE-MISSING-DATA
  gate: Missing full audit
  activation_class: TRIGGERED
  trigger: cheap triage finds material missing/selection
  execution: full only if triggered
- gate_id: GATE-WITHIN-STUDY-MULTIPLICITY
  gate: Within-study multiplicity
  activation_class: TRIGGERED
  trigger: more than one confirmatory test supports same claim
  execution: auto N/A otherwise
- gate_id: GATE-ECONOMIC-THRESHOLD
  gate: Economic threshold
  activation_class: TRIGGERED
  trigger: FORMAL_STUDY only, when an economic-effect decision requires SESOI/MDE
  execution: NOT_APPLICABLE for technical probe, measurement validation and outcome decision screen; full gate only when triggered
- gate_id: GATE-SPECIFICATION-SEARCH
  gate: Specification search / data snooping
  activation_class: TRIGGERED
  trigger: the same dataset is used repeatedly to choose window, model, rule or sample
  execution: lock the specification before formal estimation, or use a reality-check style procedure or holdout; otherwise SPECIFICATION_SEARCH_STATUS=BLOCKED;
    untriggered→NOT_APPLICABLE
- gate_id: GATE-LITERATURE-SELECTION-HURDLE
  gate: Literature selection / factor-zoo hurdle
  activation_class: TRIGGERED
  trigger: the research question itself was selected from a heavily searched research universe
  execution: raise the evidence hurdle, require independent validation or lower the claim ceiling; owned by 01_CORE at L4, not by the empirical
    multiplicity gate; untriggered→NOT_APPLICABLE
- gate_id: GATE-SCREEN-REUSE-POLICY
  gate: Screen data reuse policy
  activation_class: TRIGGERED
  trigger: OUTCOME_SCREEN_APPLICABILITY=APPLICABLE
  execution: freeze SCREEN_DATA_REUSE_POLICY before any effect is opened; default EXTERNAL_HOLDOUT; untriggered→NOT_APPLICABLE
- gate_id: GATE-TERMINATION-ARCHIVE
  gate: Terminated branch archive
  activation_class: TRIGGERED
  trigger: any formal STOP or STOP_RESOURCE_ALLOCATION verdict
  execution: complete S24 termination record before the branch is closed; untriggered→NOT_APPLICABLE
- gate_id: GATE-INFLUENCE-AUDIT
  gate: Influence audit
  activation_class: TRIGGERED
  trigger: outcome regression with plausible influential-point risk
  execution: pre-spec then B3
- gate_id: GATE-FEW-CLUSTER
  gate: Few cluster/event methods
  activation_class: TRIGGERED
  trigger: small independent shock/cluster count
  execution: CORE-M01
- gate_id: GATE-SPECIALIZED-DESIGN
  gate: Specialized human/agent/cost gates
  activation_class: TRIGGERED
  trigger: design actually uses them
  execution: load module 06 only
- gate_id: GATE-RELEASE-PACKAGING
  gate: Full release packaging
  activation_class: MILESTONE_ONLY
  trigger: formal project freeze/handoff/archive or distributable project artifact
  execution: assemble the project-specific required artifact package; do not assume repository-maintenance tooling exists in the installed Skill
- gate_id: GATE-POST-CLEAN-QA
  gate: Full post-clean QA
  activation_class: STALE_OR_CHANGED_ONLY
  trigger: data/sample/transform/aggregation changed
  execution: identity check only if no change
- gate_id: GATE-PRE-FORMAL-L4-RECHECK
  gate: Pre-formal L4 freshness/collision recheck
  activation_class: STALE_OR_CHANGED_ONLY
  trigger: stale review, fast-moving field, method/measurement change, or sentinel hit before formal study
  execution: freshness sentinel by default; full update only when triggered
- gate_id: GATE-SYSTEM-IDENTITY
  gate: System identity
  activation_class: TRIGGERED
  trigger: live/dynamic AI system, model/version/tool identity, or other system identity is material to construct
  execution: PASS/NOT_APPLICABLE before outcome-bearing execution
- gate_id: GATE-CLOSURE-LIGHT
  gate: Task closure light check
  activation_class: ALWAYS_ON
  trigger: before claiming task complete/PASS/next-step legality or delivering a result
  execution: run internal LIGHT closure before claiming complete, PASS or next-step legality, per GOV-CLOSURE01; no extra artifact by default
- gate_id: GATE-CLOSURE-MILESTONE
  gate: Task closure deep validation
  activation_class: MILESTONE_ONLY
  trigger: freeze/formal handoff/pilot result/formal result/formal dataset/code release/canonical handoff/Skill release
  execution: MILESTONE closure with task-specific executable validation
invariants:
- invariant_id: INV01
  invariant: Pre-L4 claim freeze is distinct from empirical Freeze A/B
  required_semantics: PRE_L4_CLAIM_FREEZE_STATUS separate; FREEZE_LAYER only A/B
- invariant_id: INV02
  invariant: Only OUTCOME_DECISION_SCREEN uses SCREEN_STATUS/SCREEN_VERDICT
  required_semantics: technical probe, measurement validation and formal study must not route through S15; a branch with OUTCOME_SCREEN_APPLICABILITY=NOT_APPLICABLE
    never acquires a screen verdict
- invariant_id: INV03
  invariant: Pre-outcome measurement validation precedes Death Pilot
  required_semantics: S12 PASS before S13/S15
- invariant_id: INV04
  invariant: Formal main estimation/result QA precedes mechanism, robustness and writing
  required_semantics: S19→S20→S21→S22
- invariant_id: INV05
  invariant: Risk-adaptive N/A never requires empty artifact
  required_semantics: NOT_APPLICABLE means no empty ledger/template
- invariant_id: INV06
  invariant: Post-Pilot literature update is not result-driven redesign
  required_semantics: effect sign/p-value/subgroup cannot drive collision search
- invariant_id: INV07
  invariant: Technical/data bugs use logs/tests/vendor docs before academic method literature
  required_semantics: method literature escalates only for method-level uncertainty
- invariant_id: INV08
  invariant: RE alone recovers canonical project state and stops
  required_semantics: No automatic research-state advance; structured state and registered artifacts first, archived conversation evidence only
    as needed.
- invariant_id: INV09
  invariant: AU alone audits and stops at the earliest material gap
  required_semantics: No automatic research-state advance; distinguish research-state defects from presentation issues.
- invariant_id: INV10
  invariant: Canonical project-state module contains no concrete project/candidate IDs
  required_semantics: project values live in project artifacts
- invariant_id: INV11
  invariant: Pre-L4 craft is diagnostic/optional, not an entry gate
  required_semantics: argument architecture/one-paragraph test cannot block L4 by itself
- invariant_id: INV12
  invariant: Stable release requires validator PASS after final canonical edits
  required_semantics: no ZIP publication on failed lint
- invariant_id: INV-CLOSURE-01
  invariant: No completion claim without closure PASS
  required_semantics: Any claim of COMPLETE/PASS/next-step legality requires TASK_CLOSURE_STATUS=PASS.
- invariant_id: INV-CLOSURE-02
  invariant: Last result-affecting change invalidates prior validation
  required_semantics: After any result/state-affecting edit, the final version must be revalidated before delivery.
- invariant_id: INV-CLOSURE-03
  invariant: Closure depth remains risk-adaptive
  required_semantics: Ordinary tasks use LIGHT; MILESTONE validation is reserved for high-risk formal handoffs/results/releases.
- invariant_id: INV-CLOSURE-04
  invariant: Self-repair cannot hide blockers
  required_semantics: Assistant-fixable defects are repaired before delivery; user-only dependencies remain BLOCKED and explicit.
- invariant_id: INV13
  invariant: Canonical fingerprint is recomputed, never trusted as declared
  required_semantics: The validator recomputes CANONICAL_FINGERPRINT from the declared scope and fails on mismatch; a declared-but-unverifiable
    fingerprint is not acceptable evidence.
- invariant_id: INV14
  invariant: Generated runtime is verified independently of the builder
  required_semantics: The validator re-derives generated content from the spec with its own parser; a tampered or stubbed builder cannot make
    a divergent generated file pass.
- invariant_id: INV15
  invariant: A package may not certify itself
  required_semantics: RELEASE_METADATA.json carries identity only; validation, mutation, semantic-audit and closure verdicts live in release_evidence/
    and in the detached attestation outside the ZIP.
- invariant_id: INV16
  invariant: Generated runtime is byte-identical across platforms
  required_semantics: Generated files are written LF-only so that a rebuild on Windows does not invalidate manifest, checksums or fingerprint.
- invariant_id: INV17
  invariant: Documented validator capability equals implemented validator capability
  required_semantics: Every check advertised in Index 8A maps to a named check emitted by tools/validate_skill.py.
- invariant_id: INV18
  invariant: Status values carry uniform, documented semantics
  required_semantics: PASS/CONDITIONAL/BLOCKED/NOT_APPLICABLE mean the same thing across every status field; CONDITIONAL never satisfies a downstream
    gate that requires PASS and must carry a CONDITION_TYPE.
- invariant_id: INV19
  invariant: One milestone vocabulary
  required_semantics: Closure depth, deliverable packaging and hash policy all reference the single registered MILESTONE_CLASS enum; no module
    maintains a parallel milestone list.
- invariant_id: INV20
  invariant: Freeze A checklist is derived from the state machine, not hand-maintained
  required_semantics: Module 02 section 12 must cover every field named in S13 entry and pass_condition; a second hand-written gate definition
    is a drift source.
- invariant_id: INV21
  invariant: Every canonical rule is addressable and every gate reference resolves
  required_semantics: Each rule-level heading in modules 01-07 carries a module-prefixed rule ID, and every GATE- token used in prose resolves
    to a registered gate_id.
- invariant_id: INV23
  invariant: A screen never establishes an economic null
  required_semantics: OUTCOME_DECISION_SCREEN adjudicates resource allocation only; STOP_RESOURCE_ALLOCATION means the project is not worth further
    investment under the pre-frozen screening rule, never that the effect has been shown to be economically absent. Equivalence and minimum-effect
    conclusions belong to FORMAL_STUDY.
- invariant_id: INV24
  invariant: Screen data reuse is frozen before the effect is opened
  required_semantics: SCREEN_DATA_REUSE_POLICY is recorded at S13, before B3. Default EXTERNAL_HOLDOUT. Reuse after the effect has been opened
    requires either a blinded nuisance-only argument, a valid adaptive or sequential procedure, or demotion of the formal result to exploratory.
- invariant_id: INV25
  invariant: The outcome screen is optional
  required_semantics: When a holdout would destroy formal power, OUTCOME_SCREEN_APPLICABILITY=NOT_APPLICABLE and the branch proceeds from S13
    to S17 without opening any effect.
- invariant_id: INV26
  invariant: Multiplicity is governed in three separate layers
  required_semantics: Within-study multiplicity, specification search on one dataset, and literature-level selection are distinct problems with
    distinct remedies; a within-study correction never discharges the other two.
- invariant_id: INV27
  invariant: Every terminated branch has a terminal state
  required_semantics: All formal STOP and STOP_RESOURCE_ALLOCATION paths route to S24, which records termination reason, failure class, reusable
    assets, cooldown/reopen conditions, and Seen Data status. No transition targets a bare terminal word without an archive record.
- invariant_id: INV28
  invariant: Blinding is a principle, not an event-study template
  required_semantics: The firewall hides the current study's answer while analysis choices remain discretionary; each design maps it via BLINDING_IMPLEMENTATION_MODE.
    Background familiarity with a standard dataset is not an unblinding event.
- invariant_id: INV29
  invariant: External method precedent carries an explicit transfer status
  required_semantics: Every canonical rule resting on outside methodological authority appears in the method source locator registry with a locator
    and a PRECEDENT_TRANSFER_STATUS, including what the source does not support.
- invariant_id: INV30
  invariant: Previously created or acquired project assets are resolved before re-upload is requested
  required_semantics: When a task depends on a prior artifact not directly attached, search the current workspace and registered project assets,
    verify candidate identity/version, and request user re-upload only after no usable copy is found or host access is blocked.
- invariant_id: INV31
  invariant: A recorded verification is reusable until an invalidation trigger fires
  required_semantics: Re-verification of a prior asset is triggered by change, not by the arrival of a new task. The data asset schema carries
    verified_at, verified_hash, verification_scope and verification_result so the result has somewhere to live, and PRIOR_ASSET_RESOLUTION routes
    through the reuse rule instead of re-checking unconditionally.
- invariant_id: INV32
  invariant: Estimation output requires a resolved empirical entry
  required_semantics: No coefficient, test statistic, portfolio return or model performance number is produced before the current pipeline state
    is anchored and the upstream data states are evidenced. GATE-STATE-NOSKIP carries an executable entry procedure rather than a silent posture,
    and the absence of a user request is never a reason to skip a state.
- invariant_id: INV33
  invariant: Every rule leaning on outside authority is registered or points at the registry
  required_semantics: A module rule that cites an external author, guideline or standard either has its own row in the method source locator registry
    or explicitly references that registry. The registry check runs in both directions, so a source cannot be used as authority in prose while
    being absent from the registry.
- invariant_id: INV34
  invariant: An always-on gate names an executable procedure, not a silence posture
  required_semantics: Every gate with activation_class ALWAYS_ON states what it actually does and names at least one rule that carries the procedure.
    A gate whose execution is only a declaration of silence has no way to detect the condition it guards and is indistinguishable at runtime from
    an absent gate.
- invariant_id: INV35
  invariant: Adverse evidence is held to the tier that would be needed to establish the claim
  required_semantics: A contribution may not be stopped or narrowed by a source weaker than one that could have established the same proposition.
    The tier of the adverse source is recorded, and a source below the supporting tier can at most defer the verdict, never close it. Absence
    of a search hit is search-process evidence and never establishes novelty or collision.
- invariant_id: INV36
  invariant: An irreversible action stays done after a later failure
  required_semantics: Warnings, recoverable failures and irreversible external state changes are distinguished. Once a result has been opened,
    an external job submitted, funds committed or a message sent, a subsequent error does not undo it and may not be reported as if the action
    had not occurred.
- invariant_id: INV37
  invariant: Every rule is locatable without reading its whole module
  required_semantics: A generated locator index maps every rule id to its module and section, and the loader routes through it. Locating one rule
    must not require loading a 25k-token module, because in a chat session every module read is spent permanently from the same context the work
    itself needs.
- invariant_id: INV22
  invariant: Cross-module concepts have exactly one canonical definition
  required_semantics: Evidence hierarchy, Seen Data schema and the empirical execution taxonomy are each stated once; other modules reference
    rather than restate them.
