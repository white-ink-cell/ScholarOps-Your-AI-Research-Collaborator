- rule_id: EMP-MULT04
  source: FDA, Multiple Endpoints in Clinical Trials - Guidance for Industry
  source_type: REGULATORY_GUIDANCE
  edition_year: '2022'
  chapter_section: 'final guidance October 2022, superseding the 13 January 2017 draft; section II.C Multiplicity (pp.5-6); section III.A The
    Hierarchy of Families of Endpoints (pp.6-8); section III.B Type II Error Rate and Sample Size (p.8); section IV Methodological Considerations
    (p.13); Appendix: Statistical Methods (pp.18-26)'
  page_or_article_locator: Docket FDA-2016-D-4460; grouping criterion and three-tier hierarchy at p.6; secondary and exploratory treatment at
    p.7; co-primary power arithmetic at p.8; Hochberg assumption caveat at pp.19-20; resampling caveats at p.21; nonbinding status at p.2
  doi_or_stable_id: https://www.fda.gov/media/162416/download
  fulltext_verified: 'YES'
  transfer_scope: ordering and grouping of endpoints before multiplicity adjustment, in a regulatory drug-efficacy setting
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'p.6 states the grouping criterion, and it is sharper than clinical importance alone: the critical determination is whether
    an endpoint is intended to establish effectiveness or to demonstrate additional effects, with expected event frequency and anticipated effect
    also considered. The hierarchy has exactly three tiers, primary, secondary and exploratory, and each may hold one endpoint or a family. p.7
    gives two consequences the skill now carries: exploratory endpoints need no multiplicity adjustment because they are not used to support conclusions,
    and secondary results are interpretable only after an effect on the primary family is shown, with the overall Type I error rate controlled
    across primary and secondary families together. The same page warns against long secondary lists, since adjustment shrinks the chance any
    secondary shows an effect and a hierarchy may mean lower ones are never reached. p.5 gives the arithmetic behind the gate, two independent
    endpoints roughly doubling the error rate, three reaching about 7 per cent and ten about 22 per cent, and states the sequencing principle
    that all endpoints, time points, populations and analyses are prespecified first and the adjustment chosen afterwards. p.8 quantifies the
    co-primary trade-off: two independent endpoints each powered at 80 per cent give about 64 per cent joint power'
  claim_not_supported: 'any alpha number, any approval standard, and any promotion of a secondary endpoint after a primary fails. The scope limits
    are explicit. p.2 states that guidances are nonbinding and that should means suggested, not required. p.2 also confines the document to multiple
    endpoints within a single trial and says other sources of multiplicity, including multiple doses, time points and subgroups, are not specifically
    addressed, so this row cannot be cited for the skill''s subgroup or horizon entries. Safety analyses outside a prespecified testing set are
    out of scope. The appendix constrains method choice rather than endorsing it: pp.19-20 record that the Hochberg procedure is not assumption-free
    and can fail for some negatively correlated tests, and p.21 notes resampling rests on assumptions difficult to verify and usually needs large
    samples'
- rule_id: EMP-THRESH03
  source: Lakens, Equivalence tests - a practical primer for t tests, correlations, and meta-analyses
  source_type: PEER_REVIEWED_METHOD
  edition_year: '2017'
  chapter_section: introduction and Testing for Equivalence (pp.355-356); Equivalence Tests for Differences Between Two Independent Means (pp.356-358)
    with Table 1 sample sizes (p.358); Setting Equivalence Bounds (pp.359-360); Discussion (pp.360-361)
  page_or_article_locator: Soc Psychol Personal Sci 8(4):355-362; the four possible outcomes and Figure 1 at p.356; sample-size cost in Table
    1 at p.358; the resource-determined bound and its worked numbers at p.359; operationalisation and competence limits at p.360
  doi_or_stable_id: 10.1177/1948550617697177
  fulltext_verified: 'YES'
  transfer_scope: concluding the absence of a meaningful effect, given a pre-specified bound
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'p.355 draws the distinction the rule rests on: it is statistically impossible to support the hypothesis that a true effect
    is exactly zero, but it is possible to reject effects large enough to be worthwhile, which is what the two one-sided tests procedure does
    against bounds set from the smallest effect size of interest. The same page documents how common the error is, with the phrase no effect appearing
    in 108 articles in one journal up to August 2016 almost always on the basis of nonsignificance, and Finch and colleagues reporting that around
    38 per cent of articles with nonsignificant results in one applied journal accept the null. p.356 supplies the outcome table the skill now
    uses: with both a significance test and an equivalence test there are four results, not two, since an effect can be equivalent and not different,
    different and not equivalent, both different and equivalent, or undetermined, and the last of these is the honest verdict when the data settle
    nothing. The same page notes the 90 per cent interval is the right one because two one-sided tests are run at 5 per cent each. p.359 gives
    the bound-setting rule for the common case where theory fixes no boundary: set the bound to the smallest effect the available resources give
    sufficient power to detect, so that the maximum sample size one is willing to collect implicitly determines the smallest effect size of interest;
    with 100 per condition at 80 per cent power and alpha .05 that is about 0.414 for the equivalence test. p.358 prices the alternative, with
    a bound of d = 0.1 needing 1,713 per group at 80 per cent power against 191 at d = 0.3. p.359 also requires that when equivalence is claimed
    in an abstract, the bounds used be stated there too'
  claim_not_supported: 'that equivalence means an effect is absent, or absent for anyone. p.359 is explicit that bounds set from a researcher''s
    own resources do not license a conclusion that the effect is too small to matter to others, who may reasonably fund a larger study. p.360
    adds three further limits the rule now carries: the conclusion holds for the specific operationalisation tested and a different manipulation
    or measure may still show an effect; confounds can produce apparent equivalence; and whether the experiment was performed competently is a
    non-statistical question that no equivalence test settles, which the paper describes as an inherent asymmetry between showing an effect and
    showing the absence of a worthwhile one, resolvable only by independent replication. Nothing here supplies an economic minimum, which remains
    the analyst''s burden under EMP-THRESH02'
- rule_id: EMP-MULT03
  source: Benjamini & Hochberg, Controlling the false discovery rate - a practical and powerful approach to multiple testing
  source_type: PEER_REVIEWED_METHOD
  edition_year: '1995'
  chapter_section: Summary and Introduction (pp.289-290); section 2.1 Definition of False Discovery Rate (p.291); section 2.2 Examples (p.292);
    section 3.1 The Procedure and Theorem 1 (p.293); section 3.2 worked example (pp.294-295); section 3.3 Theorem 2 (p.295); section 4 power comparisons
    (pp.296-298); section 5 Conclusion (p.298)
  page_or_article_locator: J R Stat Soc B 57(1):289-300; FDR definition and its two properties at p.291; the three example types including screening
    at p.292; Theorem 1 and its independence condition at p.293; the mortality example at p.295; weak FWER control restated at p.298
  doi_or_stable_id: 10.1111/j.2517-6161.1995.tb02031.x
  fulltext_verified: 'YES'
  transfer_scope: large exploratory families where the expected proportion of false rejections is the quantity of interest
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'p.291 defines the false discovery rate as the expected proportion of erroneous rejections among the rejected hypotheses and
    establishes the two properties that place it in the skill''s hierarchy: when every null is true the FDR coincides with the familywise rate,
    so controlling FDR gives familywise control only in the weak sense, and when some nulls are false the FDR is no larger than the familywise
    rate, so any procedure controlling FWER already controls FDR while the converse buys power. p.290 states when the weaker criterion is appropriate,
    namely when a treatment and a control are compared on several aspects of one effect and the overall conclusion need not be wrong even if some
    individual nulls are falsely rejected. p.292 names the screening case directly, where many candidate effects are sifted and the concern is
    that too large a fraction of false leads would burden a second, confirmatory phase, which is exactly the skill''s discovery family. p.293
    gives the step-up procedure and Theorem 1. p.295 shows the stake concretely: among 15 comparisons Bonferroni and Hochberg each reject the
    same three and none is mortality, while the FDR procedure at q* = .05 rejects four including mortality at p = .0095 against a threshold of
    .013'
  claim_not_supported: validity under dependence, and confirmatory use. Theorem 1 at p.293 is proved for independent test statistics; the remark
    there relaxes independence only for the statistics attached to the false nulls, so a dependent family is outside what this paper establishes
    and the analyst must justify the dependence structure separately under CORE-M01. The 1995 paper contains no dependence-robust variant. p.291
    and p.298 also make clear that FDR control delivers familywise control only weakly, so a rejection surviving this procedure does not discharge
    the strong familywise requirement a confirmatory claim carries and stays EXPLORATORY under this rule
