  chapter_section: Abstract and section 1 Introduction (p.141); section 2 Experimenter's Bias and the Motivations for Blind Analyses (p.145);
    section 3 Blind Analysis Methods (p.149), with 3.1 Hidden Signal Boxes (p.149), 3.2 Hidden Answer Methods (p.152), 3.3 Adding or Removing
