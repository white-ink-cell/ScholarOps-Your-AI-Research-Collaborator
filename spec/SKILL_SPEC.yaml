  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: SemVer 2.0.0 item 3 states that once a versioned package has been released the contents of that version must not be modified,
    and that any modification must be released as a new version. The spec repeats the point where it discusses correcting a broken release, saying
    it is unacceptable to modify versioned releases even then. That single rule is the whole of the borrowing, and it is what GOV-VERSION01 enforces
    mechanically through the fingerprint
  claim_not_supported: this package's MAJOR/MINOR/PATCH boundary. SemVer item 1 requires the versioned thing to declare a public API, and its
