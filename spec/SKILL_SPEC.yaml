  fulltext_verified: 'YES'
  transfer_scope: design-neutral blinding principle and its implementation families
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'the abstract on p.141 defines a blind analysis as preventing experimenters from knowing the answer until the analysis is complete,
    in order to stop them biasing the result toward their own preconceptions. Section 3 then shows the principle is implemented through several
    distinct families rather than one mechanism: hiding the signal region, hiding the answer, adding or removing events, and prescaling the data.
    That plurality is the precedent for the skill carrying BLINDING_IMPLEMENTATION_MODE as an enum instead of prescribing one scheme'
  claim_not_supported: that blinding certifies a result. p.149 says the method does not require analysis to stop after unblinding, nor does it
    ensure the results are correct, and that if further selections are applied after unblinding the publication should be explicit about which
    ones. Blinding constrains discretion; it does not replace disclosure, and it is not evidence of correctness
