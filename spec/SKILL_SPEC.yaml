schema_version: 3.0.0
release:
  lineage_id: SCHOLAROPS_RESEARCH
  package_id: SCHOLAROPS
  version: 1.0.0
  status: STABLE
  supersedes: ''
  architecture: SCHEMA_DRIVEN_GENERATED_RUNTIME
  skill_root: skills/scholarops
toolchain:
  builder_version: 3.0.0
  validator_version: 5.1.0
  mutation_suite_version: 3.0.0
fingerprint:
  algorithm: SHA256_OVER_SORTED_NORMALIZED_PATH_DIGEST_LINES
  newline_normalization: CRLF_AND_CR_TO_LF
  line_format: '{relpath}:{sha256_of_normalized_bytes}'
  joiner: '

    '
  scope:
  - skills/scholarops/00_CANONICAL_INDEX_EN.md
  - skills/scholarops/SKILL.md
  - skills/scholarops/modules/01_CORE_RESEARCH_WORKFLOW_EN.md
  - skills/scholarops/modules/02_EMPIRICAL_DATA_PILOT_METHODS_EN.md
  - skills/scholarops/profiles/ai-finance/PROFILE_EN.md
  - skills/scholarops/modules/04_ACCESS_INTERFACE_EN.md
  - skills/scholarops/modules/05_PROJECT_STATE_EN.md
  - skills/scholarops/modules/06_SPECIALIZED_DESIGN_EVALUATION_GATES_EN.md
  - skills/scholarops/modules/07_ARTIFACT_STATE_REPRODUCIBILITY_GOVERNANCE_EN.md
  - skills/scholarops/governance/HOST_MEMORY_LANGUAGE_EN.md
  - spec/SKILL_SPEC.yaml
  - spec/SKILL_SPEC_SCHEMA.json
  - tooling/build_runtime.py
  - tooling/validate_runtime.py
  - tests/validate_source_runtime.py
  excluded_and_why:
    skills/scholarops/runtime/*: deterministically generated from source spec and semantic modules; independently drift-checked
    skills/scholarops/references/METHOD_SOURCE_REGISTRY.csv: deterministically generated from the source spec
    README files: human-facing release documentation is built only after canonical English stabilizes
    Chinese human-facing files: derived later from stable canonical English and reviewed for semantic equivalence
reserved_state_ids:
- state_id: S14
  reason: former EXPLICIT_USER_PILOT_START; folded into S13 allowed_next guard PILOT_START_AUTHORIZATION=EXPLICIT_USER_AUTHORIZATION
  retired_in: 6.0.0
precedence_chain:
- CANONICAL_VERSION_RESOLUTION
- RE
- AU
- CONCRETE_RESEARCH_TASK
metadata_policy:
  identity_only: true
  forbidden_metadata_keys:
  - RELEASE_VALIDATION_STATUS
  - MUTATION_TEST_STATUS
  - SEMANTIC_AUDIT_STATUS
  - TASK_CLOSURE_STATUS
  - TASK_CLOSURE_DEPTH
  - REVALIDATE_AFTER_LAST_CHANGE
  rationale: a package may not certify itself; verdicts live in release_evidence/ and in the detached attestation outside the ZIP
modules:
- id: '00'
  path: 00_CANONICAL_INDEX_EN.md
  role: canonical_loader
  description: product scope, loading, command precedence, host and recovery boundaries
  load_policy: LOADER
- id: '01'
  path: modules/01_CORE_RESEARCH_WORKFLOW_EN.md
  role: canonical_core
  description: research questions, literature, contribution adjudication, claim discipline
  load_policy: TASK_ROUTED
- id: '02'
  path: modules/02_EMPIRICAL_DATA_PILOT_METHODS_EN.md
  role: canonical_empirical
  description: data, measurement, blindness, screens, formal empirical execution
  load_policy: TASK_ROUTED
- id: '03'
  path: profiles/ai-finance/PROFILE_EN.md
  role: optional_domain_profile
  description: AI x Finance specialization only
  load_policy: OPTIONAL_PROFILE
- id: '04'
  path: modules/04_ACCESS_INTERFACE_EN.md
  role: canonical_access
  description: platform-neutral data/resource access and assistant-first execution
  load_policy: TASK_ROUTED
- id: '05'
  path: modules/05_PROJECT_STATE_EN.md
  role: canonical_project_state
  description: multi-project state, isolation, hold/close/reopen governance
  load_policy: TASK_ROUTED
- id: '06'
  path: modules/06_SPECIALIZED_DESIGN_EVALUATION_GATES_EN.md
  role: canonical_specialized
  description: specialized experiment/evaluation/human-subject/cost-quality gates
  load_policy: TRIGGERED_MODULE
- id: '07'
  path: modules/07_ARTIFACT_STATE_REPRODUCIBILITY_GOVERNANCE_EN.md
  role: canonical_governance
  description: artifact identity, registries, reproducibility, delivery and release governance
  load_policy: TASK_ROUTED
- id: 08
  path: governance/HOST_MEMORY_LANGUAGE_EN.md
  role: canonical_host_governance
  description: evidence hierarchy, recovery, transcript provenance, irreversible actions, audit and language
  load_policy: TASK_ROUTED
commands:
- token: RE
  case_insensitive: true
  mode_field: RECOVERY_MODE
  mode_value: 'ON'
  action: PROJECT_STATE_RECOVERY
  precedence: 10
  alone_stop: true
  description: Recover canonical project state from structured state and registered artifacts; consult archived conversation evidence only when
    needed; do not auto-advance when RE is the only request.
- token: AU
  case_insensitive: true
  mode_field: AUDIT_MODE
  mode_value: 'ON'
  action: CURRENT_WORKFLOW_AUDIT
  precedence: 20
  alone_stop: true
  description: Audit the current research workflow and identify the earliest material gap or inconsistency; do not auto-advance when AU is the
    only request.
