  page_or_article_locator: W3C Recommendation REC-prov-dm-20130430; core triple at section 2.1; plan at sections 2.2.1.2 and 5.3.3; normative
    scope at section 1.1
  doi_or_stable_id: https://www.w3.org/TR/2013/REC-prov-dm-20130430/
  fulltext_verified: 'YES'
  transfer_scope: the vocabulary for recording what was produced, by what activity, by whom and when
  transfer_status: TRANSFERABLE_WITH_ADAPTATION
  claim_supported: 'section 1 defines provenance as a record of the people, institutions, entities and activities involved in producing, influencing
    or delivering something, and section 2.1 fixes the three core types as entity, activity and agent, an agent being whatever bears responsibility.
    That triple is why this skill records the artifact, the step that produced it and the owner rather than one free-text note. Section 5.3.3
    supplies a second and more directly useful element: a plan is an entity representing the actions intended by an agent, and recording the plan
    explicitly allows the execution to be validated against it. A frozen specification in this skill is exactly such a plan entity, which is the
    precedent for checking a run against its freeze rather than against memory'
  claim_not_supported: that this package implements PROV, and that section 2 is normative. Section 1.1 restricts the normative sections to 1.1,
    1.3, 5 and Appendix A, so the overview introducing the core triple is itself informative and only the section 5 definitions bind. PROV-DM
    specifies no serialisation; RDF, OWL and XML live in PROV-O and PROV-XML. Section 2.1.2 says PROV does not specify the conditions under which
    a derivation holds, and validity constraints are deferred to PROV-CONSTRAINTS, so nothing here certifies that a provenance record is correct
