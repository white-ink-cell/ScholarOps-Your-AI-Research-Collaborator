states:
- state_id: S00
  state: AGENDA_QUESTION_FORMATION
  owner: 01_CORE
  entry: problem/actor/construct/so-what
  required_artifact: question memo
  pass_condition: QUESTION_FORMATION_STATUS=PASS
  allowed_next: S01
  return_or_failure: revise question
  global_precondition: SESSION_CONTEXT_STATUS∈{COMPLETE,NOT_REQUIRED}
- state_id: S01
  state: LANDSCAPE_DISCOVERY
  owner: 01_CORE or 03_AI_FINANCE_PROFILE when explicitly triggered
  entry: QUESTION_FORMATION_STATUS=PASS
  required_artifact: landscape package
  pass_condition: CENSUS_STATUS=CENSUS_PARTIAL
  allowed_next: S02
  return_or_failure: S00
  global_precondition: SESSION_CONTEXT_STATUS∈{COMPLETE,NOT_REQUIRED}
- state_id: S02
  state: FOCUSED_CENSUS
  owner: 01_CORE
  entry: CENSUS_STATUS=CENSUS_PARTIAL
  required_artifact: census audit package
  pass_condition: CENSUS_STATUS=CENSUS_COMPLETE_PRE_L4 & RESEARCH_CENSUS_VERDICT=PASS_TO_PRE_L4
  allowed_next: S03
  return_or_failure: RESEARCH_CENSUS_VERDICT=NARROW→S00; RESEARCH_CENSUS_VERDICT∈{STOP_COLLISION,STOP_SO_WHAT,STOP_CONSTRUCT}→S24; incomplete→S01
  global_precondition: SESSION_CONTEXT_STATUS∈{COMPLETE,NOT_REQUIRED}
- state_id: S03
  state: PRE_L4_CLAIM_FREEZE
  owner: 01_CORE
  entry: CENSUS_STATUS=CENSUS_COMPLETE_PRE_L4 + RESEARCH_CENSUS_VERDICT=PASS_TO_PRE_L4
